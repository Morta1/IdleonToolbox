name: Deploy to Github Pages

on:
  push:
    branches:
      - main

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # postbuild derives each page's sitemap <lastmod> from that file's last commit date.
          # The default fetch-depth of 1 leaves one commit of history, which would give every
          # page the same date - the synthetic value the change was meant to remove.
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Turbopack does not write .next/cache on a build, so the old cache of it held 177 KB of nothing.
      # node_modules is what costs: a fresh install took 75 of the job's ~340 seconds.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps --include=dev --no-audit --no-fund

      - name: Build
        env:
          NODE_ENV: production

        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./out
          # One orphan commit per deploy. Without it every export (634 MB now that wiki pages
          # render at build) stacks onto gh-pages history, which had reached 2,150 commits.
          force_orphan: true
